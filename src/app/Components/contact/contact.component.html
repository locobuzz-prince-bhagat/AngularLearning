<h2>Contact Me</h2>

<label>Your Name: </label><br>
<input [(ngModel)]="userName" placeholder="Enter Your Name"><br><br>

<label>Your Contact Details</label><br>
<input [(ngModel)]="phoneNumber" placeholder="Enter Your Phone No"><br><br>
<input [(ngModel)]="emailId" placeholder="Enter Email Address"><br><br>

<p>Hello {{userName}}</p>
<p>Phone No - {{phoneNumber}}</p>
<p>Email Id - {{emailId}}</p>
